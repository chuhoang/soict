n: [0.50, 0.25, 1024]
s: [0.50, 0.50, 1024]
m: [0.50, 1.00, 512] # summary: 106 layers, 10455696 parameters, 10455696 gradients, 5.0 GFLOPs
l: [1.00, 1.00, 512] # summary: 176 layers, 12937104 parameters, 12937104 gradients, 6.2 GFLOPs
x: [1.00, 1.50, 512] # summary: 176 layers, 28458544 parameters, 28458544 gradients, 13.7 GFLOPs

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 2, C2PSA, [1024]]       # 9

head:
  # Local branch: P3 + P4 + CBAM + concat + pooling
  - [3, 1, CBAM, [3]]          # refine P3 with CBAM
  - [5, 1, CBAM, [3]]          # refine P4 with CBAM
  - [-2, 1, Conv, [128, 3, 2]]  # 7-P5/32
  - [[-2, -1], 1, Concat, [1]]   # concat P3+P4
  - [-1, 1, SPPF, [256, 5]]      # compress to 256
  # - [-1, 1, nn.AdaptiveAvgPool2d, [128]]  # GAP local → vector

  # Global branch: P5 + CBAM + pooling
  - [9, 1, CBAM, [3]]         # refine P5 with CBAM
  # - [-1, 1, nn.AdaptiveAvgPool2d, [1]]  # GAP global → vector

  # Fusion: concat local + global + classifier
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-3, -1], 1, Concat, [1]]   # concat local + global vectors
  - [-1, 1, Conv, [256, 3, 1]]
  - [-1, 1, C2PSA, [256, 1]]         # extra self-attention fusion
  - [-1, 1, Classify, [nc]]      # final classification
